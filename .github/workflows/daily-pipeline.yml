# Real-data pipeline (ADR-007, ADR-013): ECB rates → discover products → collect Shopify evidence →
# match → score. Manual only: the daily run is now a Vercel Cron that drives the same resumable
# runner (ADR-013). Useful as a fallback when Meta blocks the server's IPs, since GitHub runners
# leave from other networks; it attaches to a run that is already active on the database.
#
# Requires the repository secret DATABASE_URL (the Neon database the site reads from).
# Optional secret SHOPIFY_UCP_AGENT_PROFILE (our own UCP agent profile URL once deployed).
name: Pipeline (manual)

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "Rotating discovery keywords to sweep (max 10 = 50 Ad Library pages)"
        default: "10"
      keyword:
        description: "Optional custom keywords, comma separated (max 10, 60 characters each); replace the rotation"
        default: ""
      advertisers:
        description: "Advertisers to follow (one Ad Library page each, max 20)"
        default: "10"
      collect:
        description: "Products to collect Shopify Catalog evidence for"
        default: "20"

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHOPIFY_UCP_AGENT_PROFILE: ${{ secrets.SHOPIFY_UCP_AGENT_PROFILE }}
    steps:
      - name: Check configuration
        if: env.DATABASE_URL == ''
        run: |
          echo "::error::Repository secret DATABASE_URL is not set (see docs/DEPLOY.md)."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Run pipeline
        # Exits non-zero unless every step succeeded (e.g. a source blocked us); GitHub then emails the
        # repository owner. Partial results are still saved and listed in ingestion_runs.
        env:
          # Passed through the environment, never pasted into the script (no shell injection).
          KEYWORDS: ${{ github.event.inputs.keywords || '10' }}
          KEYWORD: ${{ github.event.inputs.keyword }}
          ADVERTISERS: ${{ github.event.inputs.advertisers || '10' }}
          COLLECT: ${{ github.event.inputs.collect || '20' }}
        run: >-
          npm run pipeline --
          "--keywords=$KEYWORDS" "--advertisers=$ADVERTISERS" "--collect=$COLLECT"
          "--keyword=$KEYWORD"
